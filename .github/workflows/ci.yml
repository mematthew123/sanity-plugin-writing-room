name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  e2e:
    name: In a logged-in Studio (Playwright)
    runs-on: ubuntu-latest
    # Needs the repository's secrets, which pull requests from forks don't get.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_E2E_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ secrets.SANITY_E2E_DATASET }}
      SANITY_E2E_TOKEN: ${{ secrets.SANITY_E2E_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Skip when the secrets aren't set
        id: secrets
        run: echo "ready=${{ secrets.SANITY_E2E_TOKEN != '' && secrets.SANITY_E2E_PROJECT_ID != '' && secrets.SANITY_E2E_DATASET != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  smoke:
    name: In a fresh Studio (sanity@${{ matrix.sanity }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared minimum (peerDependencies.sanity) and the newest release, which also
          # gets the Studio embedded in a Next.js app.
          - sanity: 6.22.0
          - sanity: latest
            flags: --embedded
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke ${{ matrix.sanity }} ${{ matrix.flags }}
